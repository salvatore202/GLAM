name: Deploy frontend to GitHub Pages

# Pubblica solo il frontend statico (l'API Java + MySQL non possono girare su
# GitHub Pages, che serve solo file statici). Una volta pubblicato, la pagina
# funzionera' pienamente solo se punti VITE_API_BASE_URL a un backend
# raggiungibile pubblicamente (vedi frontend/README.md). Senza backend
# raggiungibile resta comunque utile come anteprima dell'interfaccia.
#
# Setup richiesto una tantum: Settings -> Pages -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL base dell'API (lascia vuoto per usare http://localhost:8080/api)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (base path GitHub Pages)
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.VITE_API_BASE_URL || 'http://localhost:8080/api' }}
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
